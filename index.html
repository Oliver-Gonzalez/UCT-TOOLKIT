<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCT TOOLKIT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Main Header */
    .title-banner {
      text-align: center;
      padding-bottom: 10px;
      border-bottom: 2px solid #000000;
    }

    .main-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #000000;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .subtitle-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #1976d2;
      text-transform: uppercase;
    }

    /* Section Cards (Minimalist White Tiles) */
    .section-card {
      background: #ffffff;
      border: 2px solid #000000;
      border-radius: 8px;
      padding: 22px 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-header {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #000000;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid #000000;
    }

    .section-header::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #1976d2;
      border-radius: 2px;
    }

    .aux-card .section-header::before {
      background: #f59e0b;
    }

    /* Button Group & Links */
    .button-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .portal-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 15px 18px;
      background-color: #ffffff;
      color: #000000;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border: 1.5px solid #000000;
      border-radius: 6px;
      transition: all 0.18s ease-in-out;
      cursor: pointer;
    }

    .portal-btn:hover {
      background-color: #f8fafc;
      border-color: #1976d2;
      color: #1976d2;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(25, 118, 210, 0.12);
    }

    .portal-btn:active {
      transform: translateY(0);
    }

    .arrow-icon {
      color: #64748b;
      font-size: 14px;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .portal-btn:hover .arrow-icon {
      color: #1976d2;
      transform: translateX(4px);
    }

    /* Aux Button Hover Accent */
    .aux-card .portal-btn:hover {
      border-color: #d97706;
      color: #b45309;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.12);
    }

    .aux-card .portal-btn:hover .arrow-icon {
      color: #d97706;
    }

    /* Footer */
    .footer {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .footer-title {
      font-size: 11.5px;
      color: #000000;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .footer-contact {
      font-size: 10.5px;
      color: #4b5563;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .footer-contact a {
      color: #1976d2;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    .footer-contact a:hover {
      color: #1557b0;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Title Banner -->
    <header class="title-banner">
      <h1 class="main-title">UCT TOOLKIT</h1>
      <span class="subtitle-badge">Flight Training &amp; Operations Portal</span>
    </header>

    <!-- Header 1: BOLDFACE & OPS-LIMITS -->
    <section class="section-card">
      <div class="section-header">BOLDFACE &amp; OPS-LIMITS</div>
      <div class="button-stack">
        <!-- Site 1: T-6A -->
        <a href="https://t-6a-boldface.pages.dev/" class="portal-btn">
          <span>T-6A BOLDFACE &amp; OPS-LIMITS</span>
          <span class="arrow-icon">&rarr;</span>
        </a>

        <!-- Site 2: T-1A -->
        <a href="https://t-1a-boldface.pages.dev/" class="portal-btn">
          <span>T-1A BOLDFACE &amp; OPS-LIMITS</span>
          <span class="arrow-icon">&rarr;</span>
        </a>

        <!-- Site 3: T-38C -->
        <a href="https://t-38-boldface.pages.dev/" class="portal-btn">
          <span>T-38C BOLDFACE &amp; OPS-LIMITS (IFF)</span>
          <span class="arrow-icon">&rarr;</span>
        </a>
      </div>
    </section>

    <!-- Header 2: AUX TOOLS -->
    <section class="section-card aux-card">
      <div class="section-header">AUX TOOLS</div>
      <div class="button-stack">
        <!-- Site 4: MCSTS Playtime Calculator -->
        <a href="https://mcsts-playtime-calculator.pages.dev/" class="portal-btn">
          <span>MCSTS PLAYTIME CALCULATOR</span>
          <span class="arrow-icon">&rarr;</span>
        </a>
      </div>
    </section>

    <!-- Portal Footer -->
    <footer class="footer">
      <span class="footer-title">UCT STUDY &amp; MISSION PLANNING SUITE</span>
      <span class="footer-contact">
        Questions/Comments/Feedback: <a href="mailto:oliver.gonzalez.1@us.af.mil">oliver.gonzalez.1@us.af.mil</a>
      </span>
    </footer>

  </div>

</body>
</html>
